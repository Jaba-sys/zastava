<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Застава — такой страницы нет</title>
<meta name="robots" content="noindex">

<!--
  Страница «не найдено».

  Firebase Hosting сам отдаёт этот файл на любой неизвестный адрес — достаточно,
  чтобы он назывался 404.html и лежал в корне. Отдельной настройки не нужно.

  Сделана она не «чтобы была». Человек попадает сюда двумя путями, и оба живые:
  опечатался в адресе или пришёл по старой ссылке на страницу, которой больше
  нет. В обоих случаях белый лист с английским словом Error — тупик: непонятно,
  сломался сайт или ошибся ты. Поэтому здесь сказано, ЧТО именно не нашлось
  (адрес показан), и рядом стоят две двери — в лобби и на главную.

  Служебный работник тут нарочно не регистрируется: класть в кэш страницу
  ошибки незачем, а прочие страницы кэшируются сами, когда человек до них
  дойдёт.
-->

<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#0e1113">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=cyrillic,latin" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<style>
  body{display:grid; place-items:center; padding:24px}

  .lost{
    position:relative; z-index:1;
    width:min(520px, 100%);
    text-align:center;
  }

  /* Табличка. Тот же язык, что у точек закладки в бою: тёмная плашка с
     оранжевой каймой. Табличку на «Заставе» уже знают — пусть и ошибка
     говорит на том же языке, а не на языке веб-сервера. */
  .plate{
    display:inline-grid; place-items:center;
    width:132px; height:132px; margin-bottom:26px;
    background:rgba(10,12,13,.55);
    border:4px solid var(--signal);
    border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .plate b{
    font-family:var(--display); font-weight:600;
    font-size:52px; letter-spacing:.06em; line-height:1;
    color:var(--signal);
  }

  h1{
    font-family:var(--display); font-weight:600;
    font-size:26px; letter-spacing:.05em;
    margin:0 0 10px;
  }

  .lead{color:var(--muted); font-size:14.5px; margin:0 auto 22px; max-width:42ch}

  /* Адрес, которого не нашлось. Без него человек не понимает, опечатался он
     сам или сайт потерял страницу. */
  .where{
    display:block; margin:0 auto 26px; max-width:100%;
    padding:9px 12px;
    background:var(--concrete-2);
    border:1px solid var(--line); border-radius:var(--r);
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12.5px; color:rgba(236,231,219,.62);
    overflow-wrap:anywhere;
  }

  .doors{display:grid; gap:10px}
  /* margin-top у .btn-main нужен там, где кнопка идёт следом за полем ввода.
     Здесь она стоит в ряд со второй, и этот отступ просто сдвигал её вниз —
     двери получались разной высоты и на разном уровне. */
  .doors .btn{
    margin-top:0; text-decoration:none;
    display:flex; align-items:center; justify-content:center;
  }

  .fineprint{margin-top:22px; color:rgba(236,231,219,.32); font-size:12px}

  @media (min-width:520px){
    .doors{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<main class="lost">

  <div class="plate"><b>404</b></div>

  <h1>Такой страницы нет</h1>
  <p class="lead">
    Либо в адресе опечатка, либо страницу убрали. Комнаты и матчи живут не по
    своим адресам, а внутри лобби — оттуда и стоит заходить.
  </p>

  <code class="where" id="where"></code>

  <div class="doors">
    <a class="btn btn-main" href="lobby.html">В лобби</a>
    <a class="btn btn-ghost" href="index.html">На главную</a>
  </div>

  <p class="fineprint">Застава · браузерный шутер</p>

</main>

<script>
  // Показываем ровно то, что человек набрал или по чему пришёл.
  document.getElementById("where").textContent =
    location.pathname + location.search;
</script>
</body>
</html>
