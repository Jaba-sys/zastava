<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyPeal</title>

    <!-- Цвет страницы до загрузки стилей приложения. Обязательно ОБЫЧНЫМ
         правилом, а не inline-стилем на <html>: inline-стиль перебивает
         любые правила из app.css и остаётся висеть даже после смены темы —
         из-за этого при переключении на тёмную тему страница оставалась
         светлой везде, где её не закрывает собой само приложение (снизу и
         по бокам виднелся белый фон). Здесь же тот же цвет, что и --bg в
         app.css, только на время загрузки. -->
    <style>
      html { background: #16161a; }
      html[data-theme="light"] { background: #f5f2ee; }
    </style>

    <!-- Тема оформления. Этот скрипт обязан стоять ДО стилей и до рендера:
         иначе у пользователя со светлой темой страница успевает мелькнуть
         тёмной ("вспышка темы"). Логика повторяет src/utils/theme.js —
         намеренно, там же и объяснение, почему выбор хранится локально. -->
    <script>
      (function () {
        try {
          var pref =
            localStorage.getItem("mypeal.theme") || localStorage.getItem("mayak.theme");
          var light =
            pref === "light" ||
            ((pref === "system" || !pref) &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {
          /* приватный режим — останется тема по умолчанию (тёмная) */
        }
      })();
    </script>

    <!-- PWA: позволяет добавить MyPeal на домашний экран (Android — через
         manifest, iPhone — через Safari "Поделиться -> На экран Домой") и
         открываться в полноэкранном режиме, как отдельное приложение. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Значение подменяется в utils/theme.js при смене темы. -->
    <meta name="theme-color" content="#16161a" />

    <!-- Safari на iOS не умеет ставить приложения по manifest.json (в
         отличие от Chrome/Android), поэтому нужны собственные apple- теги:
         они и включают режим "как нативное приложение" (без адресной
         строки), и задают иконку на домашнем экране. -->
    <!-- apple-mobile-web-app-capable объявлен устаревшим: современные
         браузеры (включая Safari) ждут стандартный mobile-web-app-capable.
         Старый оставляем рядом — его всё ещё понимают прежние версии iOS. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyPeal" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
