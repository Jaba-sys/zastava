<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Застава</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=cyrillic,latin" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body class="in-game">

<canvas id="view"></canvas>

<!-- прицел -->
<div id="cross"><i></i><i></i><i></i><i></i></div>
<div id="hitmark"><i></i><i></i></div>
<div id="damage"></div>
<!-- окуляр винтовки: чёрная рамка вокруг кружка, видна только при прицеливании -->
<div id="scope"><i></i></div>

<!-- верхняя строка: счёт и время -->
<div id="topbar">
  <div class="chip"><b id="scoreMine">0</b><span>/</span><b id="scoreGoal">25</b><i id="scoreLabel">убийств</i></div>
  <div class="chip" id="clockChip"><b id="clock">8:00</b></div>
</div>

<!-- лента убийств -->
<div id="feed"></div>

<!-- нижняя строка: здоровье и патроны -->
<div id="bottombar">
  <div class="hp">
    <div class="hp-track"><div id="hpBar"></div></div>
    <b id="hpValue">100</b>
  </div>
  <div class="ammo">
    <i id="weaponName">Автомат</i>
    <b id="ammoValue">30</b><span>/</span><u id="ammoMax">30</u>
  </div>
</div>

<!-- подсказка по карте -->
<div id="hint"></div>

<!-- чат матча -->
<div id="chat">
  <div id="chatLog"></div>
  <input id="chatInput" maxlength="200" placeholder="Сообщение… Enter — отправить, Esc — отмена" autocomplete="off">
</div>

<!-- табло по Tab -->
<div id="board">
  <div class="board-head">
    <h2>Табло</h2><span id="boardMode"></span>
  </div>
  <div class="board-cols"><span></span><b>Боец</b><i>тег</i><u>уб.</u><u>см.</u></div>
  <div id="boardRows"></div>
</div>

<!-- крупные надписи -->
<div id="banner"><b></b><span></span></div>

<!-- экран захвата мыши и он же меню паузы -->
<div id="start">
  <b id="startTitle">Застава</b>
  <span id="startSub">Нажми, чтобы играть</span>

  <div id="pauseBox">
    <button class="btn btn-main" id="resumeBtn" type="button">Продолжить</button>

    <label class="volume">
      <span>Громкость</span>
      <input id="volume" type="range" min="0" max="100" step="1">
      <b id="volumeValue">70</b>
    </label>

    <button class="btn btn-ghost" id="leaveBtn" type="button">Выйти в лобби</button>
  </div>

  <em>W A S D — движение · ПКМ — прицел · R — перезарядка · 1 2 — оружие · Tab — табло · Enter — чат · Esc — пауза</em>
</div>

<!-- загрузка -->
<div id="loading">
  <b>Готовим карту…</b>
  <span>Соединяемся с комнатой</span>
</div>

<!-- итог матча -->
<div id="finish">
  <b>Матч окончен</b>
  <div class="finish-stats">
    <div><b id="finishKills">0</b><span>убийств</span></div>
    <div><b id="finishDeaths">0</b><span>смертей</span></div>
    <div class="earned"><b id="finishCoins">+0</b><span>монет</span></div>
  </div>
  <a class="btn btn-main" href="lobby.html">Вернуться в лобби</a>
</div>

<script type="module" src="js/game/main.js"></script>
</body>
</html>
