<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Застава — проверки</title>
<link rel="stylesheet" href="../css/base.css">
<style>
  body{padding:28px; max-width:900px; margin:0 auto}
  h1{font-family:var(--display); font-weight:600; letter-spacing:.05em; margin:0 0 4px}
  .lead{color:var(--muted); font-size:13.5px; margin:0 0 24px; max-width:70ch}
  h2{font-family:var(--display); font-size:15px; letter-spacing:.09em; text-transform:uppercase;
     color:rgba(236,231,219,.5); margin:26px 0 10px}
  .row{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:baseline;
       padding:7px 12px; background:var(--concrete-2); border:1px solid var(--line);
       border-top:0; font-size:13.5px}
  .row:first-of-type{border-top:1px solid var(--line)}
  .ok  .mark{color:var(--ok)}
  .bad .mark{color:var(--danger)}
  .bad{background:rgba(210,80,60,.1); border-color:rgba(210,80,60,.35)}
  .val{color:var(--muted); font-family:ui-monospace,monospace; font-size:12.5px}
  .total{margin-top:22px; padding:14px 16px; border-radius:var(--r); font-size:14px}
  .total.ok{background:rgba(111,156,90,.13); border:1px solid rgba(111,156,90,.4); color:#bcd9a9}
  .total.bad{background:rgba(210,80,60,.13); border:1px solid rgba(210,80,60,.4); color:#f0a99c}
</style>
</head>
<body>

<h1>Проверки</h1>
<p class="lead">
  Открой этот файл через локальный сервер (<code>npx serve</code> в корне проекта,
  затем <code>/tests/</code>). Ничего устанавливать не нужно — проверки работают на
  том же коде, что и игра.
</p>

<div id="out"></div>
<div class="total" id="total">Считаем…</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
import { PLAYER, movePlayer, onGround } from "../js/game/physics.js";
import { buildMap } from "../js/game/maps/index.js";
import { WEAPONS, WEAPON_ORDER, Arsenal, damageAt, LOADOUT_SLOTS } from "../js/game/weapons.js";

const out = document.getElementById("out");
let failed = 0;

function head(text){ out.insertAdjacentHTML("beforeend", `<h2>${text}</h2>`); }
function line(ok, name, value){
  if (!ok) failed++;
  out.insertAdjacentHTML("beforeend",
    `<div class="row ${ok ? "ok" : "bad"}"><span class="mark">${ok ? "✓" : "✕"}</span>
     <span>${name}</span><span class="val">${value}</span></div>`);
}

// ---------------------------------------------------------------------------
// Физика
//
// Самая важная проверка здесь — первая. Коробка игрока начинается ровно на
// уровне пола, и если не приподнять её на зазор, соприкосновение с полом
// считается столкновением: любой шаг вбок отменяется, и человек не может
// сдвинуться с места вообще. Один раз это уже случилось.
// ---------------------------------------------------------------------------
const box = (x,y,z,w,h,d) => ({ box: new THREE.Box3(
  new THREE.Vector3(x-w/2, y, z-d/2), new THREE.Vector3(x+w/2, y+h, z+d/2)), bulletPass:false });
const floor = box(0,-1,0, 300,1,300);

function walk(colliders, seconds, dirX){
  const s = { pos: new THREE.Vector3(0,0,0), vel: new THREE.Vector3(),
              height: PLAYER.height, fell:false, maxY:0 };
  const dt = 1/60;
  for (let t=0;t<seconds;t+=dt){
    s.vel.x += (dirX * PLAYER.speed - s.vel.x) * Math.min(1, dt*52/6);
    s.vel.y -= PLAYER.gravity*dt;
    movePlayer(s, s.vel.clone().multiplyScalar(dt), colliders);
    s.maxY = Math.max(s.maxY, s.pos.y);
  }
  return s;
}

head("Движение и столкновения");
{
  const r = walk([floor], 1, 1);
  line(r.pos.x > 5.5 && r.pos.x < 8, "бег по ровному полу за секунду", `x = ${r.pos.x.toFixed(2)} м`);
}
{
  const r = walk([floor, box(6,0,0, 1,3,10)], 2, 1);
  line(r.pos.x > 4.8 && r.pos.x < 5.6, "стена останавливает", `x = ${r.pos.x.toFixed(2)} м`);
}
{
  const r = walk([floor, box(4,0,0, 2,0.3,10)], 1.5, 1);
  line(Math.abs(r.maxY - 0.3) < 0.02, "на порожек 0.3 м заходим шагом", `высота = ${r.maxY.toFixed(2)} м`);
}
{
  const r = walk([floor, box(4,0,0, 2,0.9,10)], 1.5, 1);
  line(r.maxY < 0.05 && r.pos.x < 3.2, "уступ 0.9 м не пускает", `x = ${r.pos.x.toFixed(2)} м`);
}
{
  const stairs = [floor];
  for (let i=0;i<20;i++) stairs.push(box(3+i*0.7, 0, 0, 0.74, (i+1)*0.27, 8));
  const r = walk(stairs, 3.5, 1);
  line(r.maxY > 5.2, "лестница из 20 ступеней проходима", `подъём = ${r.maxY.toFixed(2)} м`);
}
{
  const s = { pos: new THREE.Vector3(0,10,0), vel: new THREE.Vector3(), height: PLAYER.height, fell:false };
  for (let t=0;t<2;t+=1/60){ s.vel.y -= PLAYER.gravity/60; movePlayer(s, s.vel.clone().multiplyScalar(1/60), [floor]); }
  line(Math.abs(s.pos.y) < 0.01, "падение с 10 м заканчивается на полу", `y = ${s.pos.y.toFixed(3)} м`);
}
{
  const s = { pos: new THREE.Vector3(0,0,0), vel: new THREE.Vector3(), height: PLAYER.height, fell:false };
  line(onGround(s, [floor]) === true, "опора под ногами определяется", "стоя на полу");
  s.pos.y = 3;
  line(onGround(s, [floor]) === false, "в воздухе опоры нет", "на высоте 3 м");
}

// ---------------------------------------------------------------------------
// Оружие
// ---------------------------------------------------------------------------
head("Оружие и набор в бой");
{
  const need = ["name","about","price","damage","rpm","magazine","reload",
                "spread","spreadMoving","recoil","falloffStart","falloffEnd",
                "falloffMin","pellets","zoom"];
  const broken = WEAPON_ORDER.filter(id => need.some(k => WEAPONS[id][k] === undefined));
  line(broken.length === 0, "у каждого ствола заполнены все характеристики",
       broken.length ? "не хватает у: " + broken.join(", ") : WEAPON_ORDER.length + " стволов");
}
{
  const prices = WEAPON_ORDER.map(id => WEAPONS[id].price);
  const sorted = prices.every((p, i) => i === 0 || p >= prices[i - 1]);
  line(sorted && prices[0] === 0, "цены идут по возрастанию, первый ствол бесплатный",
       prices.join(" · "));
}
{
  // Дорогой ствол не должен быть просто сильнее дешёвого на всех дистанциях —
  // иначе покупка отменяет игру. Проверяем на средней дистанции.
  const dps = id => damageAt(WEAPONS[id], 30) * WEAPONS[id].pellets * WEAPONS[id].rpm / 60;
  const best = WEAPON_ORDER.reduce((a, b) => dps(a) > dps(b) ? a : b);
  line(best !== "lmg" && best !== "sniper",
       "самый дорогой не сильнее всех на средней дистанции",
       "на 30 м лучший — " + WEAPONS[best].name);
}
{
  const a = new Arsenal(["sniper", "shotgun"]);
  const ok = a.current.id === "sniper" && a.select(1) && a.current.id === "shotgun";
  line(ok, "набор из лобби попадает в бой", a.order.join(" + "));
}
{
  const a = new Arsenal(["rifle", "smg", "sniper", "lmg"]);
  line(a.order.length === LOADOUT_SLOTS, "в бой берётся не больше двух стволов",
       a.order.length + " шт.");
}
{
  const a = new Arsenal(["ничего-такого"]);
  line(a.order[0] === "rifle", "кривой набор заменяется автоматом", a.order.join(", "));
}
{
  const a = new Arsenal(["rifle"]);
  for (let i = 0; i < WEAPONS.rifle.magazine; i++){ a.canFire(); a.consume(); a.nextShotAt = 0; }
  const started = a.canFire() === false && a.reloading;
  line(started, "пустой магазин сам уходит в перезарядку", "после 30 выстрелов");
}
{
  const far = damageAt(WEAPONS.shotgun, 40), near = damageAt(WEAPONS.shotgun, 3);
  line(far < near * 0.2, "урон дробовика падает с дистанцией",
       near.toFixed(0) + " вплотную → " + far.toFixed(1) + " на 40 м");
}

// ---------------------------------------------------------------------------
// Проходимость карт
//
// Карта раскладывается на сетку. В одной точке этажей может быть несколько —
// под навесом можно пройти и по навесу тоже, — поэтому узел графа это клетка
// ВМЕСТЕ с высотой пола. От первой точки возрождения делается обход в ширину.
// ---------------------------------------------------------------------------
const STEP = 1.5, MAX_JUMP_UP = 1.3, MAX_DROP = 14, W = PLAYER.width;

function reachability(id, range){
  const map = buildMap(id);
  const cols = map.colliders;

  const nearby = (x,z) => cols.filter(c =>
    x >= c.box.min.x - W/2 && x <= c.box.max.x + W/2 &&
    z >= c.box.min.z - W/2 && z <= c.box.max.z + W/2).map(c => c.box);

  function levels(x, z){
    const boxes = nearby(x,z);
    const cand = new Set([0]);
    for (const b of boxes) if (b.max.y >= 0 && b.max.y < 60) cand.add(+b.max.y.toFixed(3));
    return [...cand].filter(y =>
      !boxes.some(b => b.max.y > y + 0.06 && b.min.y < y + PLAYER.height)).sort((a,b)=>a-b);
  }

  const N = Math.round(range*2/STEP);
  const at = (i,j) => [-range + i*STEP, -range + j*STEP];
  const columns = new Map();
  for (let i=0;i<=N;i++) for (let j=0;j<=N;j++){
    const [x,z] = at(i,j);
    const ls = levels(x,z);
    if (ls.length) columns.set(i+","+j, ls);
  }

  const toIdx = p => [Math.round((p[0]+range)/STEP), Math.round((p[2]+range)/STEP)];
  function nodeFor(pos){
    const [i,j] = toIdx(pos);
    const ls = columns.get(i+","+j) || [];
    let best = null, bd = Infinity;
    for (const y of ls){ const d = Math.abs(y - pos[1]); if (d < bd){ bd = d; best = y; } }
    return best === null ? null : { key:`${i},${j}@${best}`, i, j, y:best, delta:bd };
  }

  const start = nodeFor(map.spawns[0].pos);
  const seen = new Set([start.key]);
  const queue = [start];
  while (queue.length){
    const cur = queue.shift();
    for (const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ni = cur.i+di, nj = cur.j+dj;
      const ls = columns.get(ni+","+nj);
      if (!ls) continue;
      const [nx,nz] = at(ni,nj);
      const boxes = nearby(nx,nz);
      for (const y of ls){
        const k = `${ni},${nj}@${y}`;
        if (seen.has(k)) continue;
        const up = y - cur.y;
        if (up > MAX_JUMP_UP || up < -MAX_DROP) continue;
        const top = Math.max(cur.y, y);
        if (boxes.some(b => b.max.y > top + 0.06 && b.min.y < top + PLAYER.height)) continue;
        seen.add(k); queue.push({ key:k, i:ni, j:nj, y });
      }
    }
  }
  return { map, seen, nodeFor };
}

for (const [id, range, title] of [["karier", 76, "Карьер"], ["depo", 70, "Депо"], ["teplitsy", 76, "Теплицы"], ["plotina", 70, "Плотина"]]){
  head("Карта «" + title + "»");
  const { map, seen, nodeFor } = reachability(id, range);
  map.spawns.forEach((s, n) => {
    const nd = nodeFor(s.pos);
    const standable = nd && nd.delta < 0.6;
    const reachable = nd && seen.has(nd.key);
    line(standable && reachable, `точка возрождения ${n + 1} — есть пол и есть дорога`,
      `[${s.pos.join(", ")}] ${standable ? "" : "ВИСИТ "}${reachable ? "" : "ОТРЕЗАНА"}`);
  });
  line(map.teamSpawns?.a?.length > 0 && map.teamSpawns?.b?.length > 0,
       "у обеих команд есть свои точки", `${map.teamSpawns.a.length} и ${map.teamSpawns.b.length}`);
}

const total = document.getElementById("total");
total.className = "total " + (failed ? "bad" : "ok");
total.textContent = failed
  ? `${failed} проверок не прошло — смотри красные строки выше.`
  : "Всё прошло. Карты проходимы, физика ведёт себя как задумано.";
</script>
</body>
</html>
