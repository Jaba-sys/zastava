<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Застава — проверки</title>
<link rel="stylesheet" href="../css/base.css">
<style>
  body{padding:28px; max-width:900px; margin:0 auto}
  h1{font-family:var(--display); font-weight:600; letter-spacing:.05em; margin:0 0 4px}
  .lead{color:var(--muted); font-size:13.5px; margin:0 0 24px; max-width:70ch}
  h2{font-family:var(--display); font-size:15px; letter-spacing:.09em; text-transform:uppercase;
     color:rgba(236,231,219,.5); margin:26px 0 10px}
  .row{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:baseline;
       padding:7px 12px; background:var(--concrete-2); border:1px solid var(--line);
       border-top:0; font-size:13.5px}
  .row:first-of-type{border-top:1px solid var(--line)}
  .ok  .mark{color:var(--ok)}
  .bad .mark{color:var(--danger)}
  .bad{background:rgba(210,80,60,.1); border-color:rgba(210,80,60,.35)}
  .val{color:var(--muted); font-family:ui-monospace,monospace; font-size:12.5px}
  .total{margin-top:22px; padding:14px 16px; border-radius:var(--r); font-size:14px}
  .total.ok{background:rgba(111,156,90,.13); border:1px solid rgba(111,156,90,.4); color:#bcd9a9}
  .total.bad{background:rgba(210,80,60,.13); border:1px solid rgba(210,80,60,.4); color:#f0a99c}
</style>
</head>
<body>

<h1>Проверки</h1>
<p class="lead">
  Открой этот файл через локальный сервер (<code>npx serve</code> в корне проекта,
  затем <code>/tests/</code>). Ничего устанавливать не нужно — проверки работают на
  том же коде, что и игра.
</p>

<div id="out"></div>
<div class="total" id="total">Считаем…</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
import { PLAYER, movePlayer, onGround, raycast } from "../js/game/physics.js";
import { buildMap } from "../js/game/maps/index.js";
import { MAIN, mapForRound, isRoundKeeper } from "../js/net/live.js";
import { WEAPONS, WEAPON_ORDER, Arsenal, damageAt, LOADOUT_SLOTS } from "../js/game/weapons.js";
import { GRENADES, Grenade, Smoke, fragDamage, smokeBlocks } from "../js/game/grenades.js";
import {
  BOMB, MODES, SIDES, SIDE_ORDER, ROUND_END, otherSide, isTeamMode,
  sideAllowed, canSwitchTo, thinnerSide
} from "../js/game/modes.js";
import { BOMB_STATE, siteAt, fuseLeft, bombCarrier } from "../js/game/bomb.js";
import { Nav } from "../js/game/nav.js";

const out = document.getElementById("out");
let failed = 0;

function head(text){ out.insertAdjacentHTML("beforeend", `<h2>${text}</h2>`); }
function line(ok, name, value){
  if (!ok) failed++;
  out.insertAdjacentHTML("beforeend",
    `<div class="row ${ok ? "ok" : "bad"}"><span class="mark">${ok ? "✓" : "✕"}</span>
     <span>${name}</span><span class="val">${value}</span></div>`);
}

// ---------------------------------------------------------------------------
// Физика
//
// Самая важная проверка здесь — первая. Коробка игрока начинается ровно на
// уровне пола, и если не приподнять её на зазор, соприкосновение с полом
// считается столкновением: любой шаг вбок отменяется, и человек не может
// сдвинуться с места вообще. Один раз это уже случилось.
// ---------------------------------------------------------------------------
const box = (x,y,z,w,h,d) => ({ box: new THREE.Box3(
  new THREE.Vector3(x-w/2, y, z-d/2), new THREE.Vector3(x+w/2, y+h, z+d/2)), bulletPass:false });
const floor = box(0,-1,0, 300,1,300);

function walk(colliders, seconds, dirX){
  const s = { pos: new THREE.Vector3(0,0,0), vel: new THREE.Vector3(),
              height: PLAYER.height, fell:false, maxY:0 };
  const dt = 1/60;
  for (let t=0;t<seconds;t+=dt){
    s.vel.x += (dirX * PLAYER.speed - s.vel.x) * Math.min(1, dt*52/6);
    s.vel.y -= PLAYER.gravity*dt;
    movePlayer(s, s.vel.clone().multiplyScalar(dt), colliders);
    s.maxY = Math.max(s.maxY, s.pos.y);
  }
  return s;
}

head("Движение и столкновения");
{
  const r = walk([floor], 1, 1);
  line(r.pos.x > 5.5 && r.pos.x < 8, "бег по ровному полу за секунду", `x = ${r.pos.x.toFixed(2)} м`);
}
{
  const r = walk([floor, box(6,0,0, 1,3,10)], 2, 1);
  line(r.pos.x > 4.8 && r.pos.x < 5.6, "стена останавливает", `x = ${r.pos.x.toFixed(2)} м`);
}
{
  const r = walk([floor, box(4,0,0, 2,0.3,10)], 1.5, 1);
  line(Math.abs(r.maxY - 0.3) < 0.02, "на порожек 0.3 м заходим шагом", `высота = ${r.maxY.toFixed(2)} м`);
}
{
  const r = walk([floor, box(4,0,0, 2,0.9,10)], 1.5, 1);
  line(r.maxY < 0.05 && r.pos.x < 3.2, "уступ 0.9 м не пускает", `x = ${r.pos.x.toFixed(2)} м`);
}
{
  const stairs = [floor];
  for (let i=0;i<20;i++) stairs.push(box(3+i*0.7, 0, 0, 0.74, (i+1)*0.27, 8));
  const r = walk(stairs, 3.5, 1);
  line(r.maxY > 5.2, "лестница из 20 ступеней проходима", `подъём = ${r.maxY.toFixed(2)} м`);
}
{
  const s = { pos: new THREE.Vector3(0,10,0), vel: new THREE.Vector3(), height: PLAYER.height, fell:false };
  for (let t=0;t<2;t+=1/60){ s.vel.y -= PLAYER.gravity/60; movePlayer(s, s.vel.clone().multiplyScalar(1/60), [floor]); }
  line(Math.abs(s.pos.y) < 0.01, "падение с 10 м заканчивается на полу", `y = ${s.pos.y.toFixed(3)} м`);
}
{
  const s = { pos: new THREE.Vector3(0,0,0), vel: new THREE.Vector3(), height: PLAYER.height, fell:false };
  line(onGround(s, [floor]) === true, "опора под ногами определяется", "стоя на полу");
  s.pos.y = 3;
  line(onGround(s, [floor]) === false, "в воздухе опоры нет", "на высоте 3 м");
}

// ---------------------------------------------------------------------------
// Оружие
// ---------------------------------------------------------------------------
head("Оружие и набор в бой");
{
  const need = ["name","about","price","damage","rpm","magazine","reload",
                "spread","spreadMoving","recoil","falloffStart","falloffEnd",
                "falloffMin","pellets","zoom"];
  const broken = WEAPON_ORDER.filter(id => need.some(k => WEAPONS[id][k] === undefined));
  line(broken.length === 0, "у каждого ствола заполнены все характеристики",
       broken.length ? "не хватает у: " + broken.join(", ") : WEAPON_ORDER.length + " стволов");
}
{
  const prices = WEAPON_ORDER.map(id => WEAPONS[id].price);
  const sorted = prices.every((p, i) => i === 0 || p >= prices[i - 1]);
  line(sorted && prices[0] === 0, "цены идут по возрастанию, первый ствол бесплатный",
       prices.join(" · "));
}
{
  // Дорогой ствол не должен быть просто сильнее дешёвого на всех дистанциях —
  // иначе покупка отменяет игру. Проверяем на средней дистанции.
  const dps = id => damageAt(WEAPONS[id], 30) * WEAPONS[id].pellets * WEAPONS[id].rpm / 60;
  const best = WEAPON_ORDER.reduce((a, b) => dps(a) > dps(b) ? a : b);
  line(best !== "lmg" && best !== "sniper",
       "самый дорогой не сильнее всех на средней дистанции",
       "на 30 м лучший — " + WEAPONS[best].name);
}
{
  const a = new Arsenal(["sniper", "shotgun"]);
  const ok = a.current.id === "sniper" && a.select(1) && a.current.id === "shotgun";
  line(ok, "набор из лобби попадает в бой", a.order.join(" + "));
}
{
  const a = new Arsenal(["rifle", "smg", "sniper", "lmg"]);
  line(a.order.length === LOADOUT_SLOTS, "в бой берётся не больше двух стволов",
       a.order.length + " шт.");
}
{
  const a = new Arsenal(["ничего-такого"]);
  line(a.order[0] === "rifle", "кривой набор заменяется автоматом", a.order.join(", "));
}
{
  const a = new Arsenal(["rifle"]);
  for (let i = 0; i < WEAPONS.rifle.magazine; i++){ a.canFire(); a.consume(); a.nextShotAt = 0; }
  const started = a.canFire() === false && a.reloading;
  line(started, "пустой магазин сам уходит в перезарядку", "после 30 выстрелов");
}
{
  const far = damageAt(WEAPONS.shotgun, 40), near = damageAt(WEAPONS.shotgun, 3);
  line(far < near * 0.2, "урон дробовика падает с дистанцией",
       near.toFixed(0) + " вплотную → " + far.toFixed(1) + " на 40 м");
}

// ---------------------------------------------------------------------------
// Гранаты
//
// Проверяем ровно то, ради чего граната вообще существует. Она должна долететь
// (и не провалиться сквозь пол на быстром броске), она не должна убивать
// сквозь стену, и дым должен ДЕЙСТВИТЕЛЬНО закрывать обзор, а не просто
// красиво висеть.
// ---------------------------------------------------------------------------
head("Гранаты");

const V = (x,y,z) => new THREE.Vector3(x,y,z);

{
  // Бросок в пол на полной скорости. Шажковое движение существует именно для
  // этого случая: одним рывком за кадр граната пролетела бы сквозь пол.
  const g = new Grenade({ kind:"frag", from:V(0,1.6,0),
                          velocity:V(0,-GRENADES.frag.throwSpeed,0), owner:"me" });
  for (let i = 0; i < 200; i++) g.step(1/60, [floor]);
  line(g.pos.y >= -0.02, "граната не проваливается сквозь пол",
       "y = " + g.pos.y.toFixed(2) + " после броска вниз на " + GRENADES.frag.throwSpeed + " м/с");
  line(Math.abs(g.vel.y) < 1.5, "и успокаивается, а не скачет вечно",
       "|vy| = " + Math.abs(g.vel.y).toFixed(2));
}
{
  // Глухая стена между броском и стеной: граната остаётся по свою сторону.
  const wall = box(3, 0, 0, 0.6, 6, 20);
  const g = new Grenade({ kind:"frag", from:V(0,1.2,0),
                          velocity:V(GRENADES.frag.throwSpeed, 0, 0), owner:"me" });
  for (let i = 0; i < 120; i++) g.step(1/60, [floor, wall]);
  line(g.pos.x < 3, "граната не пролетает сквозь стену", "x = " + g.pos.x.toFixed(2));
}
{
  const R = GRENADES.frag.radius;
  const near = fragDamage(V(0,1,0), V(1,1,0), [floor]);
  const mid  = fragDamage(V(0,1,0), V(R * 0.5, 1, 0), [floor]);
  const edge = fragDamage(V(0,1,0), V(R - 0.3, 1, 0), [floor]);
  const out  = fragDamage(V(0,1,0), V(R + 2, 1, 0), [floor]);
  line(near > mid && mid > 0 && out === 0, "урон осколочной падает к краю радиуса",
       `${near} вплотную → ${mid} на полпути → ${out} за радиусом`);
  // Падение именно квадратичное: у самой границы граната уже не делает ничего.
  // Это не придирка — на линейном падении край радиуса ещё снимал бы треть
  // здоровья, и «отбежал за угол» перестало бы спасать.
  line(edge <= 2, "у самой границы радиуса граната почти безобидна",
       `${edge} урона в ${(R - 0.3).toFixed(1)} м`);

  // Та самая стена, ради которой всё и затевалось: за углом от взрыва спасает
  // угол. Если эта строка покраснела — граната бьёт сквозь бетон.
  const wall = box(1.5, 0, 0, 0.6, 4, 12);
  line(fragDamage(V(0,1,0), V(3,1,0), [floor, wall]) === 0,
       "сквозь стену осколки не достают", "цель в 3 м, стена в 1.5 м");
}
{
  const smoke = new Smoke(V(0,1,0), 0);
  smoke.update(1, 1);                       // облако поднялось и стоит
  line(smoke.blocks(V(-9,1.6,0), V(9,1.6,0)), "дым закрывает обзор насквозь",
       "луч через центр облака");
  line(!smoke.blocks(V(-9,1.6,14), V(9,1.6,14)), "а мимо облака — не мешает",
       "луч в 14 м в стороне");
  line(smokeBlocks([smoke], V(-9,1.6,0), V(9,1.6,0)) &&
       !smokeBlocks([], V(-9,1.6,0), V(9,1.6,0)), "smokeBlocks считает по всем облакам",
       "одно облако и ни одного");
  smoke.update(1, GRENADES.smoke.duration + 1);
  line(smoke.done && !smoke.blocks(V(-9,1.6,0), V(9,1.6,0)),
       "дым рассеивается и перестаёт мешать", GRENADES.smoke.duration + " с");
}
{
  line(GRENADES.smoke.damage === 0, "дымовая никому не вредит", "урон 0");
}

// ---------------------------------------------------------------------------
// Заминирование
// ---------------------------------------------------------------------------
head("Заминирование");

{
  const sites = [[0, 0, 0], [40, 0, 0]];
  line(siteAt(V(0,0,0), sites) === 0 && siteAt(V(40,0,0), sites) === 1,
       "в центре зоны точка определяется", "A и B");
  line(siteAt(V(BOMB.siteRadius - 0.5, 0, 0), sites) === 0 &&
       siteAt(V(BOMB.siteRadius + 1, 0, 0), sites) === -1,
       "у края зоны — можно, за краем — нельзя", "радиус " + BOMB.siteRadius + " м");
  // Отдельный допуск по высоте: иначе с гребня «Плотины» закладывали бы бомбу
  // в машинный зал шестнадцатью метрами ниже.
  line(siteAt(V(0, 9, 0), sites) === -1, "с этажа выше заложить нельзя", "+9 м над точкой");
}
{
  const at = Date.now();
  const bomb = { state: BOMB_STATE.PLANTED, site: 0, at };
  line(Math.abs(fuseLeft(bomb, at) - BOMB.fuse) < 0.01, "запал начинает с полного",
       BOMB.fuse + " с");
  line(fuseLeft(bomb, at + BOMB.fuse * 1000 + 500) === 0, "и догорает до нуля",
       "через " + BOMB.fuse + " с");
  line(fuseLeft({ state: BOMB_STATE.CARRIED }, at) === null,
       "у неразложенной бомбы запала нет", "null");
  // Главный баланс режима: снять бомбу должно быть можно, но впритык.
  line(BOMB.defuseTime < BOMB.fuse, "разминировать успевают, если пришли вовремя",
       `${BOMB.defuseTime} с на снятие при запале ${BOMB.fuse} с`);
}
{
  const sessions = ["s9", "s2", "s7"];
  line(bombCarrier(sessions) === "s2" && bombCarrier([...sessions].reverse()) === "s2",
       "бомбу несёт один и тот же у всех", "порядок списка не важен");
  line(bombCarrier([]) === null, "в пустой команде нести некому", "null");
}
{
  line(MODES.bomb.respawn === false, "в заминировании не возрождаются", "раунд до конца");
  line(isTeamMode("bomb") && isTeamMode("team") && !isTeamMode("dm"),
       "заминирование — командный режим", "у него две стороны");
  line(SIDE_ORDER.length === 2 && SIDES.a.plants && !SIDES.b.plants,
       "минируют террористы, снимают спецназ", `${SIDES.a.name} / ${SIDES.b.name}`);
  line(otherSide("a") === "b" && otherSide("b") === "a", "стороны противоположны", "a ↔ b");

  // --- равные стороны ------------------------------------------------------
  //
  // Считаются ЛЮДИ, и только они. Боты добивают обе стороны поровну, поэтому
  // по числу бойцов перекос не виден: при одном человеке против нуля будет
  // пять на пять. Ровно на этом и ловились несправедливые команды.
  line(sideAllowed("a", { a: 0, b: 0 }) && sideAllowed("b", { a: 0, b: 0 }),
       "в пустую комнату можно за любую сторону", "0 на 0");
  line(!sideAllowed("a", { a: 1, b: 0 }) && sideAllowed("b", { a: 1, b: 0 }),
       "к одинокому человеку встать нельзя — только против",
       "1 на 0 → пускают только за вторую");
  line(sideAllowed("a", { a: 2, b: 2 }) && sideAllowed("b", { a: 2, b: 2 }),
       "при равенстве можно за любую", "2 на 2");
  line(!sideAllowed("a", { a: 3, b: 1 }), "за сторону с перевесом нельзя", "3 на 1");

  // Переход строже входа: при равенстве он сам и создаёт перекос.
  line(!canSwitchTo("b", { a: 2, b: 2 }), "переходить при равенстве нельзя",
       "2 на 2 → переход сделал бы 1 на 3");
  line(canSwitchTo("b", { a: 3, b: 1 }), "а к меньшинству — можно", "3 на 1");

  line(thinnerSide({ a: 3, b: 1 }) === "b" && thinnerSide({ a: 0, b: 0 }) === "a",
       "«всё равно» ставит туда, где людей меньше", "3 на 1 → вторая");

  // Кто выигрывает раунд. Строка про timeout — самая важная: время вышло и
  // бомба не заложена означает победу СПЕЦНАЗА, а не ничью.
  line(ROUND_END.exploded.winner === "a" && ROUND_END.defused.winner === "b" &&
       ROUND_END.timeout.winner === "b" &&
       ROUND_END.wipedA.winner === "b" && ROUND_END.wipedB.winner === "a",
       "итоги раунда достаются правильной стороне",
       "взрыв → Т, снятие → СН, время вышло → СН");
}

// ---------------------------------------------------------------------------
// Проходимость карт
//
// Карта раскладывается на сетку. В одной точке этажей может быть несколько —
// под навесом можно пройти и по навесу тоже, — поэтому узел графа это клетка
// ВМЕСТЕ с высотой пола. От первой точки возрождения делается обход в ширину.
// ---------------------------------------------------------------------------
const STEP = 1.5, MAX_JUMP_UP = 1.3, MAX_DROP = 14, W = PLAYER.width;

function reachability(id, range){
  const map = buildMap(id);
  const cols = map.colliders;

  const nearby = (x,z) => cols.filter(c =>
    x >= c.box.min.x - W/2 && x <= c.box.max.x + W/2 &&
    z >= c.box.min.z - W/2 && z <= c.box.max.z + W/2).map(c => c.box);

  function levels(x, z){
    const boxes = nearby(x,z);
    const cand = new Set([0]);
    for (const b of boxes) if (b.max.y >= 0 && b.max.y < 60) cand.add(+b.max.y.toFixed(3));
    return [...cand].filter(y =>
      !boxes.some(b => b.max.y > y + 0.06 && b.min.y < y + PLAYER.height)).sort((a,b)=>a-b);
  }

  const N = Math.round(range*2/STEP);
  const at = (i,j) => [-range + i*STEP, -range + j*STEP];
  const columns = new Map();
  for (let i=0;i<=N;i++) for (let j=0;j<=N;j++){
    const [x,z] = at(i,j);
    const ls = levels(x,z);
    if (ls.length) columns.set(i+","+j, ls);
  }

  const toIdx = p => [Math.round((p[0]+range)/STEP), Math.round((p[2]+range)/STEP)];
  function nodeFor(pos){
    const [i,j] = toIdx(pos);
    const ls = columns.get(i+","+j) || [];
    let best = null, bd = Infinity;
    for (const y of ls){ const d = Math.abs(y - pos[1]); if (d < bd){ bd = d; best = y; } }
    return best === null ? null : { key:`${i},${j}@${best}`, i, j, y:best, delta:bd };
  }

  /** Куда можно дойти из точки. Отдельной функцией, потому что спрашиваем мы
      это дважды: «дойду ли я до бомбы» и «выйду ли я обратно». */
  function spread(from){
    const start = nodeFor(from);
    if (!start) return new Set();
    const seen = new Set([start.key]);
    const queue = [start];
    while (queue.length){
      const cur = queue.shift();
      for (const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const ni = cur.i+di, nj = cur.j+dj;
        const ls = columns.get(ni+","+nj);
        if (!ls) continue;
        const [nx,nz] = at(ni,nj);
        const boxes = nearby(nx,nz);
        for (const y of ls){
          const k = `${ni},${nj}@${y}`;
          if (seen.has(k)) continue;
          const up = y - cur.y;
          if (up > MAX_JUMP_UP || up < -MAX_DROP) continue;
          const top = Math.max(cur.y, y);
          if (boxes.some(b => b.max.y > top + 0.06 && b.min.y < top + PLAYER.height)) continue;
          seen.add(k); queue.push({ key:k, i:ni, j:nj, y });
        }
      }
    }
    return seen;
  }

  return { map, seen: spread(map.spawns[0].pos), nodeFor, spread };
}

for (const [id, range, title] of [["karier", 76, "Карьер"], ["depo", 70, "Депо"], ["teplitsy", 76, "Теплицы"], ["plotina", 70, "Плотина"]]){
  head("Карта «" + title + "»");
  const { map, seen, nodeFor, spread } = reachability(id, range);
  map.spawns.forEach((s, n) => {
    const nd = nodeFor(s.pos);
    const standable = nd && nd.delta < 0.6;
    const reachable = nd && seen.has(nd.key);
    line(standable && reachable, `точка возрождения ${n + 1} — есть пол и есть дорога`,
      `[${s.pos.join(", ")}] ${standable ? "" : "ВИСИТ "}${reachable ? "" : "ОТРЕЗАНА"}`);
  });
  line(map.teamSpawns?.a?.length > 0 && map.teamSpawns?.b?.length > 0,
       "у обеих команд есть свои точки", `${map.teamSpawns.a.length} и ${map.teamSpawns.b.length}`);

  // --- точки закладки -------------------------------------------------------
  //
  // Точка бомбы — это не просто координата на карте: на ней стоят, её держат и
  // с неё уходят. Поэтому спрашиваем три разные вещи, и каждая ловит свою беду:
  //
  //   пол       — точка внутри генератора или в воздухе выглядит нормально в
  //               коде и невозможна в игре. Ровно это и случилось на «Плотине»:
  //               центр машинного зала [0, 22] приходился внутрь цилиндра.
  //   дорога    — до неё должны добегать обе команды, каждая от своих точек.
  //   выход     — и обратно тоже: яма, из которой не вылезти, формально
  //               достижима, а на деле это ловушка для целой команды.
  line(map.sites?.length === 2, "на карте две точки закладки",
       map.sites ? map.sites.length + " шт." : "нет поля sites");

  (map.sites || []).forEach((pos, n) => {
    const letter = ["A", "B"][n] || String(n + 1);
    const nd = nodeFor(pos);
    const standable = nd && nd.delta < 0.6;
    line(standable, `точка ${letter} — на полу, а не внутри железа`,
         `[${pos.join(", ")}] ${standable ? "" : "просвет " + (nd ? nd.delta.toFixed(1) + " м" : "пола нет")}`);
    if (!standable) return;

    // До точки — от точек возрождения каждой команды.
    const fromA = (map.teamSpawns?.a || []).some(s => spread(s.pos).has(nd.key));
    const fromB = (map.teamSpawns?.b || []).some(s => spread(s.pos).has(nd.key));
    line(fromA && fromB, `точка ${letter} — добегают обе команды`,
         `${fromA ? "Т ✓" : "Т ОТРЕЗАНЫ"} · ${fromB ? "СН ✓" : "СН ОТРЕЗАНЫ"}`);

    // И обратно: с точки должен быть путь хотя бы к одной точке возрождения.
    const back = spread(pos);
    const out = map.spawns.some(s => { const k = nodeFor(s.pos); return k && back.has(k.key); });
    line(out, `с точки ${letter} есть выход`, out ? "не ловушка" : "ВЫЙТИ НЕЛЬЗЯ");
  });

  if (map.sites?.length === 2){
    // Две точки в одном углу — это одна точка. Спецназ должен делиться.
    const [a, s] = map.sites;
    const gap = Math.hypot(a[0] - s[0], a[1] - s[1], a[2] - s[2]);
    line(gap > BOMB.siteRadius * 4, "точки A и B разнесены",
         gap.toFixed(0) + " м между ними");
  }

  // --- откуда можно НЕ выбраться -------------------------------------------
  //
  // Проверки выше спрашивают «куда можно дойти». Этого мало: рёбра прохода
  // односторонние — спрыгнуть можно на четырнадцать метров, а забраться на
  // полтора. Значит, бывает место, куда дойти легко, а выйти нельзя вовсе.
  // Формально карта проходима, а человек сидит в канаве до конца раунда.
  //
  // Считает это тот же граф, по которому ходят боты (js/game/nav.js), так что
  // проверка и игра смотрят на карту одними глазами. На «Карьере» она нашла
  // восемьдесят одну клетку за дренажным тоннелем: спрыгнул с крыши — и всё.
  // Лечится отвалом вдоль канавы, см. karier.js.
  {
    const nav = new Nav(map);
    line(nav.oneWay === 0, "нет мест, откуда не выбраться",
         nav.oneWay ? `${nav.oneWay} клеток без выхода` : "ни одной");

    // И боту есть дорога на обе точки закладки — с обеих сторон.
    let unreachable = 0;
    for (const side of ["a", "b"]){
      for (const spawn of map.teamSpawns?.[side] || []){
        for (const site of map.sites || []){
          if (!nav.path(new THREE.Vector3(...spawn.pos), new THREE.Vector3(...site))) unreachable++;
        }
      }
    }
    line(unreachable === 0, "бот доходит до точек от каждой точки возрождения",
         unreachable ? `${unreachable} маршрутов не нашлось` : "все маршруты есть");
  }
}

// ---------------------------------------------------------------------------
// Имена над головами: видно ли бойца отсюда
// ---------------------------------------------------------------------------
//
// Ровно та проверка, по которой игра решает, гасить ли имя (stepLabels в
// main.js): луч от глаз к голове чужого бойца. Если он упирается в геометрию
// раньше — имя прячем. Стекло преградой не считается, и это не оплошность:
// сквозь стекло человека видно целиком, прятать над ним имя было бы странно.

head("Имена над головами");

/** Видно ли точку B из точки A сквозь геометрию карты. */
function visible(map, a, b){
  const from = new THREE.Vector3(...a);
  const to   = new THREE.Vector3(...b);
  const dir  = to.clone().sub(from);
  const dist = dir.length();
  dir.divideScalar(dist);
  return !raycast(from, dir, map.colliders, [], dist - 0.3);
}

const EYE = PLAYER.eye;
{
  const depo = buildMap("depo");
  // Поворотный круг открыт — с одного его края виден другой. Луч ведём по
  // z = 4, а не через самый центр: ровно в центре стоит мачта фонаря, и через
  // неё, разумеется, ничего не видно — первая же версия этой проверки на ней
  // и споткнулась.
  line(visible(depo, [-10, EYE, 4], [10, EYE, 4]),
       "на открытом месте бойца видно", "поворотный круг, 20 м");
  // Ряды вагонов идут по z = ±17 и ±34; между z = -10 и z = -24 стоит вагон.
  line(!visible(depo, [0, EYE, -10], [0, EYE, -24]),
       "сквозь вагон бойца НЕ видно", "z от -10 до -24, ряд на -17");
  // И он же не должен «просвечивать» с большого расстояния вдоль карты.
  line(!visible(depo, [0, EYE, 6], [0, EYE, 40]),
       "сквозь два ряда вагонов тоже не видно", "z от 6 до 40");
}
{
  const tep = buildMap("teplitsy");
  // Теплица на (-40, -30) размером 34 x 22: стеклянные боковины на z = -41 и
  // -19. Ведём луч по x = -38, а не по -40: на -40 приходится стойка рамы, она
  // непрозрачная и луч честно ловит именно её.
  line(visible(tep, [-38, EYE, -46], [-38, EYE, -30]),
       "сквозь стекло теплицы бойца видно", "стекло не преграда для луча");
  // Котельная в центре кирпичная и глухая — сквозь неё видно быть не должно.
  line(!visible(tep, [-16, EYE, 0], [16, EYE, 0]),
       "сквозь котельную не видно", "двор, x от -16 до 16");
}

// ---------------------------------------------------------------------------
// Общий сервер: раунды и смена карты
// ---------------------------------------------------------------------------

head("Общий сервер");

line(mapForRound(1) === MAIN.maps[0] && mapForRound(5) === MAIN.maps[0],
     `первые ${MAIN.mapsPerCycle} раундов идут на одной карте`,
     `1 → ${mapForRound(1)}, ${MAIN.mapsPerCycle} → ${mapForRound(MAIN.mapsPerCycle)}`);

line(mapForRound(MAIN.mapsPerCycle + 1) === MAIN.maps[1],
     `на ${MAIN.mapsPerCycle + 1}-м раунде карта меняется`,
     `${MAIN.mapsPerCycle} → ${mapForRound(MAIN.mapsPerCycle)}, ` +
     `${MAIN.mapsPerCycle + 1} → ${mapForRound(MAIN.mapsPerCycle + 1)}`);

{
  // Круг замыкается: после последней карты снова первая, и так бесконечно.
  const perCycle = MAIN.mapsPerCycle, count = MAIN.maps.length;
  const afterFullCircle = mapForRound(perCycle * count + 1);
  line(afterFullCircle === MAIN.maps[0], "круг карт замыкается",
       `раунд ${perCycle * count + 1} → ${afterFullCircle}`);

  // Все карты в списке существуют. Опечатка в имени дала бы «Карьер» вместо
  // задуманной карты — buildMap молча подставляет его для незнакомого имени.
  const known = MAIN.maps.every(id => buildMap(id).spawns?.length > 0);
  line(known, "все карты цикла существуют", MAIN.maps.join(", "));
}

{
  // Ведущий — ровно один и тот же у всех, кто видит один список.
  const sessions = ["s9", "s2", "s7"];
  const keepers = sessions.filter(s => isRoundKeeper(s, sessions));
  line(keepers.length === 1 && keepers[0] === "s2",
       "раунды ведёт ровно один и тот же", keepers.join(", ") || "никто");
  // Он ушёл — дело берёт следующий, и снова один.
  const left = ["s9", "s7"];
  const next = left.filter(s => isRoundKeeper(s, left));
  line(next.length === 1 && next[0] === "s7",
       "ведущий ушёл — берёт следующий", next.join(", ") || "никто");
  line(!isRoundKeeper("s1", []), "в пустой комнате вести некому", "нет игроков");
}

const total = document.getElementById("total");
total.className = "total " + (failed ? "bad" : "ok");
total.textContent = failed
  ? `${failed} проверок не прошло — смотри красные строки выше.`
  : "Всё прошло. Карты проходимы, физика ведёт себя как задумано.";
</script>
</body>
</html>
